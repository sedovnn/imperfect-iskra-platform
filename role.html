<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ваша роль — i(m)perfect · «Искра»</title>
<meta name="description" content="Введение в роль перед ассессментом «Искра»." />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- ШРИФТ ГРУЗИТСЯ НЕБЛОКИРУЮЩЕ. Обычный <link rel="stylesheet"> задерживает
     ИСПОЛНЕНИЕ скриптов до ответа шрифтового CSS: если fonts.googleapis.com
     отвечает медленно, страница висит пустой, хотя вся её логика уже загружена
     (поймано 06.08 на переходе между экранами). media="print" снимает
     блокировку, onload возвращает стиль в дело; noscript — путь без JS. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" /></noscript>
<link rel="stylesheet" href="css/styles.css?v=187" />
</head>
<body data-case-src="case-v8.html">

<!-- ЭКРАН 2 ИЗ ТРЁХ (решение владельца 06.08): настройка (intro.html) → РОЛЬ →
     материалы (assessment.html).
     ⚠ Это обратное решению 04.08, по которому роль уехала со экрана установки на
     страницу чтения пакета. Тогда причина была в том, что на одном экране стояли
     история роли и технические правила прохождения; теперь та же причина решается
     разделением, а не склейкой: здесь роль и устройство ассессмента, на следующем
     экране только материалы.
     НИ ОДНОЙ СТРОКИ ТЕКСТА В ЭТОМ ФАЙЛЕ. Роль, правила и примечание берутся из
     js/scenes.js (S.system) — того же блока, который харнесс отдаёт модели в
     system. Иначе у человека и у модели разъедется постановка задачи. -->

<div class="frame">
  <div class="intro" id="roleBody">

    <header class="intro-head">
      <a class="logo" href="index.html">futureproof<span class="logo-arrow"><svg viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg"><path d="M0 1 L13 7 L0 13 Z" fill="#FF4800"/></svg></span><span class="logo-prod">i(m)perfect</span></a>
      <p class="kicker" style="margin:0;">Перед стартом · 2 из 2</p>
    </header>

    <div class="intro-hero">
      <p class="kicker">Перед стартом</p>
      <h1 id="roleTitle">Введение <span style="color:var(--accent);">в роль</span></h1>
      <div id="roleLead"><!-- S.system.lead --></div>
    </div>

    <div class="intro-cols">
    <!-- Ряд подзаголовков: линия над ним идёт через оба столбца. -->
    <div class="intro-row">
<div class="pgroup">
      <p class="kicker" id="rulesKicker">Как устроен ассессмент</p>
      <div id="roleRules"><!-- S.system.rules --></div>
    </div>
<div class="pgroup">
      <p class="kicker" id="screenKicker">Как устроен экран ассессмента</p>
      <div id="roleScreen"><!-- S.system.screen --></div>
      <!-- СХЕМА ЭКРАНА, а не снимок (решение владельца 07.08: «посадим экран ассессмента,
           обезличенный и не раскрывающий ответов и вопросов»). Схема ничего не раскрывает
           по построению: в ней нет ни одного слова из маршрута — только полосы вместо
           текста. Снимок пришлось бы переснимать после каждой правки экрана, и он бы
           неизбежно тащил куски настоящих реплик. -->
      <figure class="scr" aria-hidden="true">
        <div class="scr-frame">
          <div class="scr-top"><span class="scr-logo"></span><span class="scr-bar w40"></span></div>
          <div class="scr-body">
            <div class="scr-col scr-left">
              <span class="scr-k">Этапы</span>
              <span class="scr-bar w70"></span><span class="scr-bar w55"></span>
              <span class="scr-bar w80"></span><span class="scr-bar w60"></span>
            </div>
            <div class="scr-col scr-mid">
              <span class="scr-k">Разговор и ответ</span>
              <span class="scr-bubble"><span class="scr-bar w80"></span><span class="scr-bar w60"></span></span>
              <span class="scr-field"></span>
              <span class="scr-btn"></span>
            </div>
            <div class="scr-col scr-right">
              <span class="scr-tabs"><b>О компании</b><i>Мои заметки</i><i>Справка</i><i>Мои ответы</i></span>
              <span class="scr-bar w90"></span><span class="scr-bar w75"></span><span class="scr-bar w85"></span>
              <span class="scr-bar w65"></span><span class="scr-bar w80"></span><span class="scr-bar w50"></span>
            </div>
          </div>
        </div>
      </figure>
    </div>
    </div>

    <!-- Ряд подзаголовков: линия над ним идёт через оба столбца. -->
    <div class="intro-row">
<div class="pgroup">
      <p class="kicker">Чего платформа не умеет</p>
      <div id="roleHow"><!-- S.system.howItWorks --></div>
    </div>
    </div>

    </div><!-- /intro-cols -->


    <p class="intro-disclaimer" id="roleNote"><!-- S.system.note --></p>

    <!-- ?start=1 — признак «участник прошёл оба экрана до старта». Без него
         ассессмент отправляет на первый экран пути: порядок входа один, а не два.
         Геометрия ряда — как у действия в ассессменте: записка слева, кнопка справа. -->
    <div class="intro-cta">
      <a class="btn btn-primary" id="roleCta" href="assessment.html?start=1">Приступить к ассессменту →</a>
    </div>

    <footer class="intro-foot">
      <a class="intro-back" href="intro.html">← Как проходить ассессмент</a>
    </footer>

  </div>
</div>

<script src="js/main.js?v=7"></script>
<script src="js/scenes.js?v=90"></script>
<script>
  (function () {
    if (window.imp && window.imp.blockIfPhone && window.imp.blockIfPhone('roleBody')) return;
    var S = window.imp.scenes, sys = (S && S.system) || {};
    var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
    var br = function (s) { return esc(s).replace(/\n/g, '<br />'); };
    // Подстановка имени — та же и единственная разрешённая, что в движке ({name}).
    // Здесь она нужна на случай, если в роль когда-нибудь войдёт обращение; пустое
    // имя не оставляет висящей запятой.
    var nm = '';
    try {
      var s0 = JSON.parse(sessionStorage.getItem('imp_current_session')
        || localStorage.getItem('imp_current_session') || 'null');
      nm = (s0 && s0.name ? String(s0.name) : '').trim();
    } catch (e) {}
    var subst = function (t) {
      if (t.indexOf('{name}') < 0) return t;
      if (nm) return t.split('{name}').join(nm);
      // Имени нет — обращение убирается вместе с запятой, и абзац начинался бы со
      // строчной: «вы — независимый консультант». Поднимаем первую букву.
      var out = t.replace(/,\s*\{name\}/g, '').replace(/\{name\}\s*,\s*/g, '').split('{name}').join('');
      return out.charAt(0).toUpperCase() + out.slice(1);
    };

    document.getElementById('roleLead').innerHTML =
      (sys.lead || []).map(function (p) { return '<p class="section-lead lead">' + br(subst(p)) + '</p>'; }).join('');
    document.getElementById('rulesKicker').textContent = sys.title || 'Как устроен ассессмент';
    // Пункты нумерованы так же, как принципы на настройке (.prin), и нумерация
    // СКВОЗНАЯ через оба блока: «как устроен ассессмент» и «как устроен экран» —
    // один список из семи пунктов, разделённый заголовком (решение владельца 07.08).
    var prin = function (r, i) {
      return '<div class="prin"><span class="n">' + (i + 1) + '</span>' +
             '<span class="t">' + br(r) + '</span></div>';
    };
    var rules = sys.rules || [], screen = sys.screen || [];
    document.getElementById('roleRules').innerHTML = rules.map(prin).join('');
    document.getElementById('screenKicker').textContent = sys.screenTitle || 'Как устроен экран ассессмента';
    document.getElementById('roleScreen').innerHTML =
      screen.map(function (r, i) { return prin(r, rules.length + i); }).join('');
    document.getElementById('roleHow').innerHTML =
      (sys.howItWorks || []).map(function (p) { return '<p class="intro-note">' + br(p) + '</p>'; }).join('');
    document.getElementById('roleNote').innerHTML = '<i>' + br(sys.note || '') + '</i>';

    if (window.imp && window.imp.typoDom) window.imp.typoDom(document.getElementById('roleBody'));
  })();
</script>
<script src="js/typo.js?v=2"></script>
</body>
</html>

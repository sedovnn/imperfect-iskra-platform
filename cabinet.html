<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Оценки — i(m)perfect · «Искра»</title>
<meta name="description" content="Кабинет оценок платформы v2: ответы, десять способностей, флаги." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- ШРИФТ ГРУЗИТСЯ НЕБЛОКИРУЮЩЕ. Обычный <link rel="stylesheet"> задерживает
     ИСПОЛНЕНИЕ скриптов до ответа шрифтового CSS: если fonts.googleapis.com
     отвечает медленно, страница висит пустой, хотя вся её логика уже загружена
     (поймано 06.08 на переходе между экранами). media="print" снимает
     блокировку, onload возвращает стиль в дело; noscript — путь без JS. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" /></noscript>
<link rel="stylesheet" href="css/styles.css?v=229" />
</head>
<body>

<div id="cabGate" class="gate">
  <div class="gate-card">
    <p class="kicker">Кабинет</p>
    <h2>Оценки</h2>
    <p class="section-lead" style="margin:0 0 20px;">Пароль вам передаст команда.</p>
    <div class="field">
      <label for="cabPass">Пароль</label>
      <input type="password" id="cabPass" autocomplete="current-password" />
    </div>
    <p class="field-err" id="cabPassErr" style="display:none;">Неверный пароль.</p>
    <button class="btn btn-primary btn-block" id="cabPassBtn" style="margin-top:14px;">Войти →</button>
  </div>
</div>

<div class="frame station-frame" id="cabContent" style="display:none;">
  <div class="station-shell">

    <header class="station-header">
      <div class="station-header-left">
        <a class="logo" href="index.html">futureproof<span class="logo-arrow"><svg viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg"><path d="M0 1 L13 7 L0 13 Z" fill="#FF4800"/></svg></span><span class="logo-prod">i(m)perfect</span></a>
        <!-- ⚠ ЗАГОЛОВОК ПОСЛЕ ЛОГО УБРАН ВМЕСТЕ СО СЛЕШЕМ (решение владельца 26.08),
             и на всех трёх страницах, где он был: здесь, в кабинете и в харнессе.
             Он назывался по-разному, но работал одинаково — второй заголовок рядом с
             тем, что и так написано на самой странице. Что это за экран, участник
             читает в теле, а не в хроме. Слеш снят тоже: разделять больше нечего. -->
      </div>
      <div class="station-header-right" data-no-refs="1">
        <span class="cab-status" id="cabStatus"></span>
        <span class="bib" id="cabCount">—</span>
        <button type="button" class="btn btn-ghost btn-sm" id="cabRefresh">Обновить</button>
      </div>
    </header>

    <!-- Порядок вкладок — порядок работы: сначала смотрят, как идёт день и что ждёт
         человека; потом ищут участника и раздают доступ; волны настраивают до дня и
         трогают реже всего, поэтому они последние.
         «Ростер» из подписи убран: слово пришло из прежнего экрана и ничего не
         объясняет тому, кто открыл кабинет впервые. -->
    <nav class="cab-tabs" role="tablist">
      <button type="button" class="cab-tab is-on" data-view="day" role="tab" aria-selected="true">Оценка участников</button>
      <button type="button" class="cab-tab" data-view="roster" role="tab" aria-selected="false">Номера и пароли</button>
      <button type="button" class="cab-tab" data-view="waves" role="tab" aria-selected="false">Волны</button>
    </nav>

    <div class="cab-body" id="cabViewDay">
      <div class="cab-filters">
        <label class="cab-filter"><input type="checkbox" id="cabOnlyNeed" /> Только те, кто ждёт человека <span class="bib" id="cabNeedCount">0</span></label>
        <label class="cab-filter"><input type="checkbox" id="cabShowOld" /> Показать прежние прогоны</label>
      </div>
      <div id="cabList"><p class="fac-detail-loading">Загружаю…</p></div>
    </div>

    <div class="cab-body" id="cabViewRoster" style="display:none;">
      <div class="cab-filters">
        <label class="cab-filter cab-search">
          <span class="cab-vh">Поиск по номеру или имени</span>
          <input type="search" id="cabRosterFind" class="cab-inp" placeholder="номер или имя" />
        </label>
        <label class="cab-filter"><span class="cab-vh">Волна</span><select id="cabRosterWave" class="cab-inp"></select></label>
        <label class="cab-filter"><input type="checkbox" id="cabRosterShowPw" /> Пароли</label>
        <button type="button" class="btn btn-ghost btn-sm" id="cabRosterCopy">Скопировать для раздачи</button>
        <button type="button" class="btn btn-ghost btn-sm" id="cabGenPass">Дописать пароли, где их нет</button>
      </div>
      <div id="cabRoster"><p class="cab-dim">Загружаю…</p></div>
    </div>

    <div class="cab-body" id="cabViewWaves" style="display:none;">
      <div class="cab-filters">
        <label class="cab-filter"><input type="checkbox" id="cabShowArchived" /> Показать архивные</label>
      </div>
      <div id="cabWaves"><p class="cab-dim">Загружаю…</p></div>
      <div id="cabIssueOut" aria-live="polite"></div>

      <details class="cab-more">
        <summary>Новая волна</summary>
        <div class="cab-form">
          <label class="field-inline"><span>Номер</span><input type="text" class="cab-inp" id="cabWaveNum" inputmode="numeric" maxlength="3" placeholder="021" /></label>
          <label class="field-inline"><span>Название</span><input type="text" class="cab-inp cab-inp-wide" id="cabWaveName" placeholder="видно только вам" /></label>
          <label class="field-inline field-check"><input type="checkbox" id="cabWaveAi" /><span>прогон модели</span></label>
          <button type="button" class="btn btn-primary btn-sm" id="cabWaveAdd">Добавить</button>
        </div>
      </details>
    </div>

  </div>
</div>

<div id="cabDetail" class="dossier-overlay" style="display:none;" aria-hidden="true">
  <div class="gate-card dossier-card cab-card" role="dialog" aria-modal="true" aria-label="Карточка участника">
    <div class="dossier-card-header">
      <div>
        <p class="kicker">Карточка участника</p>
        <h2 style="margin:0;" id="cabDetailTitle">—</h2>
      </div>
      <button type="button" class="btn btn-ghost btn-xs" id="cabDetailClose">Закрыть ✕</button>
    </div>
    <div class="fac-detail-body" id="cabDetailBody"></div>
  </div>
</div>

<script src="js/main.js?v=7"></script>
<script src="js/typo.js?v=2"></script>
<script src="js/dialog.js?v=1"></script>
<script src="js/api.js?v=5"></script>
<!-- МАРШРУТ И МЕХАНИКИ ГРУЗЯТСЯ ЗДЕСЬ РОВНО ТЕМИ ЖЕ ФАЙЛАМИ, что на экране
     участника. Кабинет берёт из них названия и порядок шагов (scenes.js →
     S.windows()) и читаемый вид верстаков (mechanics.js → answerHtml): своего
     списка шагов и своего уплощателя у него нет, иначе один и тот же ответ
     назывался бы и выглядел бы в двух местах по-разному. -->
<script src="js/backlog.js?v=8"></script>
<script src="js/scenes.js?v=162"></script>
<script src="js/mechanics.js?v=80"></script>
<script src="js/cabinet.js?v=23"></script>
</body>
</html>

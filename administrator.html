<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Администратор — i(m)perfect</title>
<meta name="description" content="Кабинет администратора: потоки, участники и их оценка, ведущие." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<!-- ШРИФТ ГРУЗИТСЯ НЕБЛОКИРУЮЩЕ. Обычный <link rel="stylesheet"> задерживает
     ИСПОЛНЕНИЕ скриптов до ответа шрифтового CSS: если fonts.googleapis.com
     отвечает медленно, страница висит пустой, хотя вся её логика уже загружена
     (поймано 06.08 на переходе между экранами). media="print" снимает
     блокировку, onload возвращает стиль в дело; noscript — путь без JS. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" /></noscript>
<link rel="stylesheet" href="css/styles.css?v=271" />
</head>
<!-- ⚠ ДВЕ СТРАНИЦЫ: АДМИНИСТРАТОР И ВЕДУЩИЙ (решение владельца 03.10, названия его же). Это
     бывший cabinet.html; страница ведущего — vedushchiy.html со своим скриптом. Ведущего, вошедшего
     сюда, js/cabinet.js отправляет на его страницу. cabinet.html — перенаправление сюда.
     ⚠ УСТРОЕНА ЧЕРЕЗ ПОТОКИ, КАК КАБИНЕТ ВЕДУЩЕГО (решение владельца 03.10): «Все потоки» →
     поток (участники с оценкой, настройки) и «Ведущие»; поиск участника — в шапке. Экраны
     рисует js/cabinet.js в #admMain по адресу после «#». -->
<body data-page="admin" class="ved">

<div id="cabGate" class="gate">
  <div class="gate-card">
    <p class="kicker">Кабинет</p>
    <h2>Администратор</h2>
    <div class="field">
      <label for="cabPass">Пароль</label>
      <input type="password" id="cabPass" autocomplete="current-password" />
    </div>
    <p class="field-err" id="cabPassErr" style="display:none;">Неверный пароль.</p>
    <button class="btn btn-primary btn-block" id="cabPassBtn" style="margin-top:14px;">Войти →</button>
  </div>
</div>

<div id="cabContent" style="display:none;">
  <header class="ved-hd adm-hd">
    <a class="logo" href="administrator.html">futureproof<span class="logo-arrow"><svg viewBox="0 0 59.29 57.69" xmlns="http://www.w3.org/2000/svg"><path d="M9.94 27.73C8.41 22.99 -0.94 4.76 0.08 1.75C0.36 0.92 0.89 0.48 1.98 0.02C8.65 -0.71 50.12 15.72 57.23 19.99C58.2 20.58 59.21 22.02 59.28 22.79C59.37 23.68 58.95 25.38 58.27 26C52.27 31.12 10.29 57.55 4.26 57.69C3.07 57.32 2.44 56.88 2.02 56.05C0.43 52.9 8.89 32.86 9.94 27.73Z" fill="#FF4800"/></svg></span><span class="logo-prod">i(m)perfect</span></a>
    <nav class="adm-nav"><a href="#" data-go="">Потоки</a><a href="#fac" data-go="fac">Ведущие</a></nav>
    <span class="cab-status" id="cabStatus" aria-live="polite"></span>
    <input type="search" class="adm-find" id="admFind" placeholder="Найти участника: номер или имя" aria-label="Найти участника" />
    <span class="ved-who">Администратор · <a href="#" id="admOut">выйти</a></span>
  </header>
  <main class="ved-wrap adm-wrap" id="admMain"></main>
</div>

<div id="vedQrFull" class="ved-qrfull" style="display:none;" role="dialog" aria-label="QR-код потока">
  <div class="ved-qrfull-in"><div id="vedQrFullImg"></div><p id="vedQrFullLink"></p><p class="ved-dim">Нажмите, чтобы закрыть</p></div>
</div>

<!-- Карточка участника — отдельная страница kartochka.html (решение владельца 15.10); всплывающей карточки здесь больше нет. -->

<script src="js/main.js?v=13"></script>
<script src="js/typo.js?v=4"></script>
<script src="js/dialog.js?v=1"></script>
<script src="js/api.js?v=11"></script>
<!-- МАРШРУТ ГРУЗИТСЯ ЗДЕСЬ ТЕМ ЖЕ ФАЙЛОМ, что на экране участника: список потока
     берёт из scenes.js этап, на котором участник сейчас, — своего списка этапов у
     кабинета нет. Ответы и механики (backlog.js, mechanics.js, mech-fields.js) читает
     карточка участника — kartochka.html, с 15.10. -->
<script src="js/scenes.js?v=207"></script>
<script src="js/qr.js?v=1"></script>
<script src="js/cabinet.js?v=79"></script>
</body>
</html>

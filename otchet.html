<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Отчёт участника — futureproof · i(m)perfect</title>
<meta name="description" content="Отчёт об оценке стратегического мышления: введите свой номер участника." />
<meta name="robots" content="noindex, nofollow" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" /></noscript>
<link rel="stylesheet" href="css/styles.css?v=265" />
<style>
  /* Тот же лист, что окно входа (index.html): та же колонка, то же поле номера. */
  .entry { min-height: 100vh; display: flex; flex-direction: column; }
  .entry-wrap { max-width: var(--maxw); width: 100%; margin: 0 auto; padding: 0 clamp(20px, 4vw, 56px); flex: 1; display: flex; flex-direction: column; }
  .entry-head { display: flex; align-items: baseline; justify-content: space-between; padding: 22px 0 18px; border-bottom: 1px solid var(--hairline); }
  .entry-sec { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-soft); }
  .entry-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: clamp(40px, 7vh, 96px) 0; }
  .entry-col { max-width: 460px; }
  .entry-col h1 { font-family: var(--ff-display); font-weight: 800; font-size: clamp(38px, 6vw, 60px); line-height: 1.0; letter-spacing: -.015em; text-transform: uppercase; margin: 20px 0 0; }
  .entry-col h1 .hl { color: var(--accent); }
  .entry-lead { font-size: 16px; line-height: 1.55; color: var(--muted); margin-top: 18px; max-width: 42ch; }
  .entry-form { margin-top: 34px; }
  .entry-form .field { margin-bottom: 20px; }
  .code-input { width: 100%; height: 56px; padding: 0 16px; font-family: inherit; font-weight: 700; font-size: 24px; letter-spacing: .3em; color: var(--ink); border: 1px solid var(--hairline); border-radius: var(--radius); outline: none; background: var(--paper); }
  .code-input::placeholder { letter-spacing: .3em; color: var(--muted-soft); font-weight: 500; }
  .code-input:focus, .pass-input:focus { border-color: var(--ink); }
  .entry-hint { font-size: 13px; color: var(--muted-soft); margin-top: 14px; }
  .entry-err { display: none; margin-top: 14px; font-size: 13px; color: #c4362b; }
  .entry-err.show { display: block; }
</style>
</head>
<body>
<!-- ОТЧЁТ УЧАСТНИКА ПО НОМЕРУ (решения владельца 05.10 и 14.10).
     Адрес — без кодов и параметров: человек открывает страницу и вводит свой номер участника, который
     записал при входе. Бэкенд отдаёт отчёт, только если команда нажала «Проверено» в кабинете и отчёт
     собран (code.js — doReportGet); о готовности участнику сообщает HR. По номеру прежнего вида (одни
     цифры) отчёт не выдаётся: такие номера перебираются. Отчёт открывается на месте этой страницы —
     со своими стилями; в Google это только HTML, на сервере компании в нём есть кнопка «Сохранить PDF». -->
<div class="frame entry">
  <div class="entry-wrap">

    <header class="entry-head">
      <a class="logo" href="index.html">futureproof<span class="logo-arrow"><svg viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg"><path d="M0 1 L13 7 L0 13 Z" fill="#FF4800"/></svg></span><span class="logo-prod">i(m)perfect</span></a>
      <div class="entry-sec">Отчёт участника</div>
    </header>

    <main class="entry-main">
      <div class="entry-col">
        <p class="kicker">Стратегическое мышление</p>
        <h1>Ваш отчёт</h1>
        <p class="entry-lead">Введите номер участника — шесть знаков, которые платформа выдала вам при входе в ассессмент.</p>
        <form class="entry-form" id="reportForm" novalidate autocomplete="off">
          <div class="field">
            <label for="reportCode">Номер участника — 6 знаков</label>
            <input class="code-input" id="reportCode" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="6" placeholder="HK7RQ4" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="reportGo">Открыть отчёт →</button>
          <p class="entry-err" id="reportErr" role="status"></p>
          <p class="entry-hint">Не нашли номер? Обратитесь к организатору ассессмента.</p>
        </form>
      </div>
    </main>

    <footer class="entry-foot">
      <div class="entry-fnote">© futureproof</div>
    </footer>

  </div>
</div>
<script src="js/api.js?v=9"></script>
<script>
(function () {
  var form = document.getElementById('reportForm');
  var input = document.getElementById('reportCode');
  var go = document.getElementById('reportGo');
  var err = document.getElementById('reportErr');
  var say = function (t) { err.textContent = t; err.classList.toggle('show', !!t); };
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var bib = String(input.value || '').trim().toUpperCase();
    if (!/^[A-Z0-9]{6}$/.test(bib)) { say('Проверьте номер — шесть знаков, буквы и цифры.'); input.focus(); return; }
    say('');
    go.disabled = true;
    go.textContent = 'Открываю…';
    window.imp.callApi('reportGet', { bib: bib }).then(function (res) {
      if (res && res.ok && res.html) {
        // Отчёт — целая страница со своими стилями: открывается на месте этой.
        document.open();
        document.write(res.html);
        document.close();
        return;
      }
      go.disabled = false;
      go.textContent = 'Открыть отчёт →';
      say(res === null ? 'Сервер не ответил. Попробуйте ещё раз через минуту.'
        : 'Отчёта по этому номеру нет. Проверьте номер; если отчёт ещё не готов, вам сообщат, когда он появится.');
    });
  });
})();
</script>
</body>
</html>

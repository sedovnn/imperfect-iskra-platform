<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Сводка валидации — i(m)perfect</title>
<meta name="description" content="Сводка экспертной валидации методологии: согласие, матрица путаницы, лестница уровней." />
<meta name="robots" content="noindex, nofollow" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" /></noscript>
<link rel="stylesheet" href="css/styles.css?v=270" />
<link rel="stylesheet" href="css/expert.css?v=13" />
</head>
<body class="p-expert">

<div class="frame station-frame">
  <div class="station-shell">

    <!-- Лого здесь НЕ ссылка. На остальных страницах оно ведёт на index.html —
         вход в ассессмент; отсюда это увело бы эксперта в чужой продукт, да ещё
         посреди разбора, из которого он потом не поймёт, как вернуться.
         Стиль .logo не задаёт ни hover, ни visited, поэтому span выглядит
         ровно как прежняя ссылка. -->
    <header class="station-header">
      <div class="station-header-left">
        <span class="logo">futureproof<span class="logo-arrow"><svg viewBox="0 0 59.29 57.69" xmlns="http://www.w3.org/2000/svg"><path d="M9.94 27.73C8.41 22.99 -0.94 4.76 0.08 1.75C0.36 0.92 0.89 0.48 1.98 0.02C8.65 -0.71 50.12 15.72 57.23 19.99C58.2 20.58 59.21 22.02 59.28 22.79C59.37 23.68 58.95 25.38 58.27 26C52.27 31.12 10.29 57.55 4.26 57.69C3.07 57.32 2.44 56.88 2.02 56.05C0.43 52.9 8.89 32.86 9.94 27.73Z" fill="#FF4800"/></svg></span><span class="logo-prod">i(m)perfect</span></span>
      </div>
      <div class="station-header-right">
        <span class="cab-status" id="rCount"></span>
      </div>
    </header>

    <main class="xhost">
      <!-- Окно пароля рисует js/expert-lock.js; тело сводки до него скрыто.
           Пароль тот же, что у экспертов: он расшифровывает описания, без
           которых сводка не знает, какой ответ верный. -->
      <div id="rGate"></div>

      <div id="rBody" style="display:none;">
        <div class="xwide-report">
          <p class="kicker">Валидация методологии</p>
          <h1>Сводка</h1>

          <!-- Два пути загрузки, и оба нужны. Файлы работают уже сегодня: пока
               бэкенд не принимает saveExpert, эксперт скачивает свой ответ на
               финише и присылает его. Кнопка сервера — отдельный пароль команды,
               он уходит на бэкенд и проверяется ТАМ. Проверять его на клиенте
               было бы театром: статика отдаётся целиком любому, кто знает адрес. -->
          <div class="xr-load" id="rDrop">
            <label class="btn btn-primary" for="rFiles">Загрузить файлы ответов</label>
            <input type="file" id="rFiles" accept="application/json,.json" multiple hidden />
            <span class="xr-or">или перетащите их сюда</span>
            <button type="button" class="btn btn-ghost btn-sm" id="rLocal">Ответы из этого браузера</button>
            <span class="xr-sep"></span>
            <input type="password" id="rPass" class="xr-pass" placeholder="пароль команды" autocomplete="current-password" />
            <button type="button" class="btn btn-ghost btn-sm" id="rPull">Забрать с сервера</button>
          </div>
          <p class="field-err" id="rErr" style="display:none;"></p>
        </div>

        <div id="rHost"></div>
      </div>
    </main>

  </div>
</div>

<script src="js/expert-api.js?v=6"></script>
<script src="js/expert-lock.js?v=2"></script>
<script src="js/typo.js?v=4"></script>
<script src="js/expert-corpus.js?v=8"></script>
<script src="js/expert-report.js?v=4"></script>
</body>
</html>

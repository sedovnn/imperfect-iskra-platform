<body data-page="host" class="ved">

<div id="vedGate" class="gate">
  <div class="gate-card">
    <p class="kicker">Кабинет</p>
    <h2>Ведущий</h2>
    <p class="section-lead" style="margin:0 0 20px;">Ключ ведущего вам передаст администратор.</p>
    <div class="field">
      <label for="vedKey">Ключ</label>
      <input type="password" id="vedKey" autocomplete="current-password" />
    </div>
    <p class="field-err" id="vedKeyErr" style="display:none;"></p>
    <button class="btn btn-primary btn-block" id="vedKeyBtn" style="margin-top:14px;">Войти →</button>
  </div>
</div>

<div id="vedApp" style="display:none;">
  <header class="ved-hd">
    <a class="logo" href="vedushchiy.html">futureproof<span class="logo-arrow"><svg viewBox="0 0 14 14" xmlns="http://www.w3.org/2000/svg"><path d="M0 1 L13 7 L0 13 Z" fill="#FF4800"/></svg></span><span class="logo-prod">i(m)perfect</span></a>
    <span class="ved-who"><span id="vedWho">Ведущий</span> · <a href="#" id="vedOut">выйти</a></span>
  </header>
  <main class="ved-wrap" id="vedMain"></main>
</div>

<div id="vedQrFull" class="ved-qrfull" style="display:none;" role="dialog" aria-label="QR-код потока">
  <div class="ved-qrfull-in"><div id="vedQrFullImg"></div><p id="vedQrFullLink"></p><p class="ved-dim">Нажмите, чтобы закрыть</p></div>
</div>

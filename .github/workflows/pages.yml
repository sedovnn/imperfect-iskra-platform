name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Соседние пуши не отменяют идущую сборку — из-за этого раньше терялись публикации.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # Не используем actions/deploy-pages: он ждёт очередь Pages 10 минут (лимит жёсткий,
      # выше не поднимается), а по таймауту ОТМЕНЯЕТ уже созданный деплоймент — то есть
      # убивает публикацию, которая доехала бы позже, и оставляет призрака, блокирующего
      # следующие попытки. Здесь деплоймент только создаётся; очередь Pages разберёт его
      # сама, когда сможет. Статус проверяется снаружи, через Deployments API.
      - name: Создать деплоймент Pages и не ждать очередь
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          art=$(curl -sS -H "Authorization: token $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            | python3 -c "import sys,json; a=[x for x in json.load(sys.stdin)['artifacts'] if x['name']=='github-pages']; print(a[0]['id'])")
          echo "артефакт: $art"

          jwt=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=github-pages" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")

          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages/deployments" \
            -d "{\"artifact_id\": $art, \"pages_build_version\": \"$GITHUB_SHA\", \"oidc_token\": \"$jwt\"}")

          echo "ответ Pages ($code):"
          cat resp.json
          echo

          case "$code" in
            200|201) echo "Деплоймент создан. Очередь Pages разберёт его сама." ;;
            *) echo "::error::Pages отказал с кодом $code — см. ответ выше"; exit 1 ;;
          esac
